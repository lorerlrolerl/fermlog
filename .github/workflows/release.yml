name: Release

on:
  push:
    branches: ["main"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version
        id: version
        run: |
          # Get latest tag
          LATEST=$(git tag --sort=-v:refname | grep "^v" | head -1)
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          echo "Latest tag: $LATEST"

          MAJOR=$(echo $LATEST | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo $LATEST | cut -d. -f2)
          PATCH=$(echo $LATEST | cut -d. -f3)

          # Read commit messages since last tag
          COMMITS=$(git log ${LATEST}..HEAD --format="%s")
          echo "Commits since $LATEST:"
          echo "$COMMITS"

          # Determine bump type
          if echo "$COMMITS" | grep -qE "^feat!:|BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            MINOR=$((MINOR + 1)); PATCH=0
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE "^fix(\(.+\))?:|^perf(\(.+\))?:"; then
            PATCH=$((PATCH + 1))
            BUMP="patch"
          else
            echo "No version bump needed"
            echo "bumped=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG ($BUMP bump)"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "bumped=true" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        if: steps.version.outputs.bumped == 'true'
        run: |
          LATEST=$(git tag --sort=-v:refname | grep "^v" | head -1)
          NOTES=$(git log ${LATEST}..HEAD --format="- %s" | grep -vE "^- (chore|docs|style|ci)(\(.+\))?:")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create tag and release
        if: steps.version.outputs.bumped == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}
          gh release create ${{ steps.version.outputs.tag }} \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "${{ steps.notes.outputs.notes }}"