{% extends "base_form.html" %}
{% block title %}edit history entry — {{ schedule.name }} — ferm{% endblock %}
{% block form_title %}edit history entry{% endblock %}

{% block form_content %}
<div class="breadcrumb">
  <a href="/schedules">schedules</a><span class="breadcrumb-sep">/</span>
  <a href="/schedules/{{ schedule.id }}">{{ schedule.name }}</a><span class="breadcrumb-sep">/</span>
  <span>edit entry</span>
</div>

<form method="post" action="/schedules/{{ schedule.id }}/events/{{ event.id }}/edit">
  <div class="form-section">
    <div class="form-section-title">{{ schedule.name }} · {{ target_name }}</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
      <div class="field">
        <label>Completed at</label>
        <input type="datetime-local" name="completed_at"
          value="{{ event.completed_at.strftime('%Y-%m-%dT%H:%M') if event.completed_at else '' }}" />
      </div>
      <div class="field">
        <label>Was due</label>
        <input type="datetime-local" name="due_at"
          value="{{ event.due_at.strftime('%Y-%m-%dT%H:%M') if event.due_at else '' }}" />
      </div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea name="notes" placeholder="What was done, any observations...">{{ event.notes or '' }}</textarea>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">save changes</button>
    <a href="/schedules/{{ schedule.id }}" class="btn btn-ghost">cancel</a>
  </div>
</form>
{% endblock %}
